# Lints the library with arduino-lint and compiles all examples against
# Arduino-ESP32 on every push to main and every pull request.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Arduino lint (strict, library-manager update)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: arduino/arduino-lint-action@v2
        with:
          project-type: library
          library-manager: update
          compliance: strict

  native-test:
    name: Host unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build and run signing tests
        run: |
          cc  -std=c99   -Wall -Wextra -Isrc -c src/monocypher.c src/monocypher-ed25519.c
          g++ -std=c++11 -Wall -Wextra -Isrc -o test_signing \
              test/native/test_signing.cpp src/SimpleOTASigning.cpp \
              monocypher.o monocypher-ed25519.o
          ./test_signing

      - name: Build and run tick conversion tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Isrc -o test_time test/native/test_time.cpp
          ./test_time

      - name: Build and run trial record and outbox tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Isrc -o test_trial test/native/test_trial.cpp
          ./test_trial

      - name: Build and run watchdog tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Isrc -o test_watchdog test/native/test_watchdog.cpp
          ./test_watchdog

      - name: Build and run server URL tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Isrc -o test_url test/native/test_url.cpp
          ./test_url

  compile:
    name: Compile examples (ESP32)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compile sketches
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          libraries: |
            - source-path: ./
          enable-deltas-report: true
          sketches-report-path: sketches-reports

      - name: Upload sketches report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sketches-reports
          path: sketches-reports

  rollback-hook:
    name: Rollback hook and watchdog (core ${{ matrix.core }}, ${{ matrix.flags || 'default' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core: ["2.0.17", "3.3.0"]
        flags: ["", "-DSIMPLEOTA_DISABLE_BOOTLOADER_ROLLBACK", "-DSIMPLEOTA_DISABLE_TRIAL_WATCHDOG"]

    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Compile BasicOTA and check verifyRollbackLater and the watchdog
        run: |
          set -euo pipefail
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${{ matrix.core }}
          arduino-cli compile --fqbn esp32:esp32:esp32 --library "$PWD" \
            --warnings all --build-path "$PWD/build" \
            --build-property "compiler.cpp.extra_flags=${{ matrix.flags }}" \
            --build-property "compiler.c.extra_flags=${{ matrix.flags }}" \
            examples/BasicOTA
          nm_bin=$(find "$HOME/.arduino15/packages/esp32/tools" -name 'xtensa-esp*-elf-nm' | head -1)
          hook=$("$nm_bin" build/libraries/*/SimpleOTAClient.cpp.o | grep -c ' T verifyRollbackLater$' || true)
          wdt=$("$nm_bin" build/libraries/*/SimpleOTAWdt.c.o | grep -cE ' U wdt_hal_init$' || true)
          case "${{ matrix.flags }}" in
            "")                                    want_hook=1; want_wdt=1 ;;
            -DSIMPLEOTA_DISABLE_BOOTLOADER_ROLLBACK) want_hook=0; want_wdt=0 ;;
            -DSIMPLEOTA_DISABLE_TRIAL_WATCHDOG)    want_hook=1; want_wdt=0 ;;
          esac
          echo "verifyRollbackLater: $hook (want $want_hook); wdt_hal_init: $wdt (want $want_wdt)"
          [ "$hook" = "$want_hook" ] && [ "$wdt" = "$want_wdt" ]
          if [ "$want_hook" = 1 ]; then
            "$nm_bin" build/BasicOTA.ino.elf | grep -E ' T verifyRollbackLater$'
          fi
